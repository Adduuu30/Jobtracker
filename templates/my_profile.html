{% extends "base.html" %}

{% block title %}My Profile - JobTracker{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-md-7 col-lg-5">

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                My Profile
            </h1>

            <p class="text-muted">
                Manage your account information
            </p>

        </div>


        <div class="card border-0 shadow-sm rounded-4">

            <div class="card-body p-4 p-md-5">


                <!-- Profile Information -->

                <form method="POST" action="/my-profile">

                    <h5 class="mb-3">
                        Profile Information
                    </h5>


                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            value="{{ user[0] }}"
                            required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ user[1] }}"
                            required>

                    </div>


                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Save Profile

                        </button>

                    </div>

                </form>


                <!-- Change Password -->

                <form method="POST" action="/change-password">

                    <hr class="my-4">

                    <h5 class="mb-3">
                        Change Password
                    </h5>


                    <div class="mb-3">

                        <label class="form-label">
                            Current Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="current_password"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="new_password"
                            required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="confirm_password"
                            required>

                    </div>


                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-warning">

                            Change Password

                        </button>

                    </div>

                </form>


                <!-- Logout -->

                <div class="d-grid mt-3">

                    <a
                        href="/logout"
                        class="btn btn-danger">

                        Logout

                    </a>

                </div>


            </div>

        </div>

    </div>

</div>

{% endblock %}
