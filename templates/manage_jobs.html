{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Manage Jobs</h2>

<table class="table table-bordered table-hover">

    <thead class="table-dark">
        <tr>
            <th>SR No.</th>
            <th>Company</th>
            <th>Role</th>
            <th>Apply Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

        {% for job in jobs %}

        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ job[1] }}</td>
            <td>{{ job[2] }}</td>
            <td>{{ job[6] }}</td>
            <td>{{ job[5] }}</td>

            <td>
                <a href="/edit-job/{{ job[0] }}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="/delete-job/{{ job[0] }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this job?')">
                    Delete
                </a>
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
