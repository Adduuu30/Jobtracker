<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - JobTracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .brand {
            font-size: 32px;
            font-weight: 700;
            color: #0d6efd;
        }

        .login-button {
            transition: all 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.3);
        }

        .form-control {
            padding: 12px;
        }

    </style>

</head>


<body>

    <div class="card login-card">

        <div class="card-body p-4 p-md-5">

            <!-- Brand -->
            <div class="text-center mb-4">

                <div class="brand">
                    JobTracker
                </div>

                <p class="text-muted mt-2 mb-0">
                    Login to manage your job applications
                </p>

            </div>


            <!-- Login Form -->
            <form method="POST">

                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary btn-lg w-100 login-button">

                    Login

                </button>

            </form>


            <!-- Signup -->
            <div class="text-center mt-4">

                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="/signup"
                       class="text-decoration-none fw-semibold">
                        Sign up
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
